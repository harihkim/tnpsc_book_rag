[project]
name = "tnpsc-book-rag-backend"
version = "0.1.0"
description = "English-first RAG backend for Tamil Nadu State Board textbooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.112.0",
    "fastapi[standard]>=0.139.0",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis",
    "httpx2",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tnpsc_book_rag"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=tnpsc_book_rag",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["tnpsc_book_rag"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tnpsc_book_rag"]

[tool.ty.environment]
python-version = "3.13"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = [".venv"]
python-version = "3.13"
search-path = ["src"]
preset = "strict"
