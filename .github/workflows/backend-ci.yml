name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: tnpsc_test
          POSTGRES_USER: tnpsc
          POSTGRES_PASSWORD: tnpsc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tnpsc -d tnpsc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.2
          python-version: "3.13"
          working-directory: backend
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --frozen

      - name: Run static quality gates
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check
          uv run --locked pyrefly check

      - name: Run offline tests
        run: uv run --locked pytest -m "not postgres"

      - name: Run PostgreSQL integration and migration tests
        env:
          TNPSC_TEST_DATABASE_URL: postgresql+psycopg://tnpsc:tnpsc@127.0.0.1:5432/tnpsc_test
        run: uv run --locked pytest -s -m postgres

      - name: Validate Compose topology
        working-directory: .
        run: docker compose config --quiet
